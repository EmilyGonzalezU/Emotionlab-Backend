name: Backend CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Ejecutar pruebas disponibles
        run: |
          if find . -type f -name "test_*.py" \
            -not -path "./.git/*" \
            -not -path "./.venv/*" \
            -not -path "./venv/*" \
            | grep -q .
          then
            python -m pytest -v
          else
            echo "No se encontraron archivos de pruebas."
            echo "Se omite pytest."
          fi
