name: Auditoria de arquitectura EmotionLab

on:
  workflow_dispatch:
  # Mantener la auditoría manual para evitar ejecuciones y consultas AWS innecesarias.

permissions:
  contents: read

concurrency:
  group: emotionlab-architecture-audit
  cancel-in-progress: true

jobs:
  audit:
    name: Analizar repositorio y AWS (solo lectura)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      AWS_REGION: us-east-1
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Auditar código del repositorio
        run: |
          mkdir -p audit-output/repository
          python .github/scripts/audit_repository.py \
            --root . \
            --output audit-output/repository/repository-audit.md \
            --json audit-output/repository/repository-audit.json

      - name: Comprobar si hay credenciales AWS de solo lectura
        id: aws_credentials_check
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
        run: |
          if [[ -n "$AWS_ACCESS_KEY_ID" && -n "$AWS_SECRET_ACCESS_KEY" && -n "$AWS_SESSION_TOKEN" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "No se configuraron las tres credenciales temporales de AWS Academy. Se omitirá la consulta AWS."
          fi

      - name: Configurar credenciales temporales AWS Academy
        if: steps.aws_credentials_check.outputs.available == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Auditar recursos AWS (consultas de solo lectura)
        if: steps.aws_credentials_check.outputs.available == 'true'
        shell: bash
        run: |
          mkdir -p audit-output/aws
          set +e

          run_aws() {
            local name="$1"
            shift
            echo "Consultando: $name"
            aws "$@" --no-cli-pager > "audit-output/aws/${name}.json" 2> "audit-output/aws/${name}.error"
            local rc=$?
            if [[ $rc -eq 0 ]]; then
              rm -f "audit-output/aws/${name}.error"
            else
              echo "La consulta $name no pudo completarse. Revisa su archivo .error."
            fi
          }

          run_aws identity sts get-caller-identity --output json

          run_aws lambda-functions lambda list-functions \
            --query 'Functions[].{Name:FunctionName,Runtime:Runtime,Handler:Handler,PackageType:PackageType,LastModified:LastModified,Timeout:Timeout,MemorySize:MemorySize}' \
            --output json

          run_aws apigateway-v2 apigatewayv2 get-apis --output json
          run_aws apigateway-rest apigateway get-rest-apis --output json

          run_aws ecr-repositories ecr describe-repositories --output json
          run_aws ecr-model-images ecr describe-images \
            --repository-name emotionlab-model-portable --output json

          run_aws dynamodb-tables dynamodb list-tables --output json
          run_aws s3-buckets s3api list-buckets --output json

          run_aws iam-roles iam list-roles \
            --query 'Roles[].{RoleName:RoleName,Arn:Arn,CreateDate:CreateDate}' \
            --output json

          run_aws cloudwatch-log-groups logs describe-log-groups \
            --query 'logGroups[].{Name:logGroupName,Retention:retentionInDays,StoredBytes:storedBytes}' \
            --output json

          run_aws ecs-clusters ecs list-clusters --output json
          run_aws ec2-instances ec2 describe-instances \
            --query 'Reservations[].Instances[].{Id:InstanceId,State:State.Name,Type:InstanceType,Name:Tags[?Key==`Name`].Value|[0]}' \
            --output json

          run_aws beanstalk-applications elasticbeanstalk describe-applications --output json

          # Consultas detalladas a las tablas conocidas: solo metadatos, nunca elementos.
          for table in \
            emotionlab-dev-users \
            emotionlab-dev-participants \
            emotionlab-dev-sessions \
            emotionlab-dev-report-requests \
            emotionlab-dev-audit-logs
          do
            aws dynamodb describe-table \
              --table-name "$table" \
              --region "$AWS_REGION" \
              --no-cli-pager \
              --query 'Table.{Name:TableName,Status:TableStatus,ItemCount:ItemCount,KeySchema:KeySchema,Indexes:GlobalSecondaryIndexes[].IndexName}' \
              --output json \
              > "audit-output/aws/dynamodb-${table}.json" \
              2> "audit-output/aws/dynamodb-${table}.error"
            if [[ $? -eq 0 ]]; then
              rm -f "audit-output/aws/dynamodb-${table}.error"
            fi
          done

          # Ubicación de los buckets conocidos; no lista ni descarga objetos.
          for bucket in emotionlab-dev-sessions-raw emotionlab-dev-report-pdfs; do
            aws s3api get-bucket-location \
              --bucket "$bucket" \
              --no-cli-pager \
              --output json \
              > "audit-output/aws/s3-${bucket}-location.json" \
              2> "audit-output/aws/s3-${bucket}-location.error"
            if [[ $? -eq 0 ]]; then
              rm -f "audit-output/aws/s3-${bucket}-location.error"
            fi
          done

          # Genera un resumen legible sin exponer valores de configuración de funciones.
          {
            echo "# Auditoría AWS"
            echo
            echo "- Región consultada: ${AWS_REGION}"
            echo "- Fecha UTC: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "- Las consultas son de lectura; no se listan objetos S3 ni elementos DynamoDB."
            echo
            echo "## Archivos generados"
            find audit-output/aws -maxdepth 1 -type f -printf '%f\n' | sort
          } > audit-output/aws/aws-audit-summary.md

      - name: Registrar que AWS fue omitido
        if: steps.aws_credentials_check.outputs.available != 'true'
        run: |
          mkdir -p audit-output/aws
          cat > audit-output/aws/README.md <<'EOF'
          # Auditoría AWS omitida
          No se encontraron los tres GitHub Secrets requeridos:
          - AWS_ACCESS_KEY_ID
          - AWS_SECRET_ACCESS_KEY
          - AWS_SESSION_TOKEN

          La auditoría del repositorio sí se ejecutó. Añade credenciales temporales vigentes de AWS Academy como GitHub Secrets y vuelve a ejecutar manualmente el workflow.
          EOF

      - name: Crear índice del informe
        if: always()
        shell: bash
        run: |
          mkdir -p audit-output
          {
            echo "# Auditoría de arquitectura EmotionLab"
            echo
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Rama: ${GITHUB_REF_NAME}"
            echo "- Fecha UTC: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo
            echo "## Contenido"
            echo "- repository/: análisis estático del repositorio."
            echo "- aws/: inventario de recursos AWS, si se configuraron credenciales."
            echo
            echo "## Limitaciones"
            echo "El análisis estático identifica referencias en el código, pero no demuestra por sí solo que una integración esté operativa."
            echo "Las consultas AWS pueden estar incompletas si el rol de AWS Academy no tiene permisos de lectura."
          } > audit-output/README.md

      - name: Subir informe de auditoría
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emotionlab-architecture-audit-${{ github.run_number }}
          path: audit-output/
          if-no-files-found: warn
          retention-days: 14
