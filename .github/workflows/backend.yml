name: Backend CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run offline backend tests
        env:
          PYTHONPATH: ${{ github.workspace }}
          AWS_EC2_METADATA_DISABLED: "true"
        run: |
          python -m pytest -v \
            tests/test_app_factory.py \
            tests/test_audit_service.py \
            tests/test_auth_dual_verify_token.py \
            tests/test_cognito_new_password_challenge.py \
            tests/test_lambda_handler.py \
            tests/test_participant_id.py \
            tests/test_session_processing_service.py \
            tests/test_storage_repository.py
