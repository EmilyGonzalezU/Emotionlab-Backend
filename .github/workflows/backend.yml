name: Backend CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
jobs:
  test:

    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Mostrar estructura
        run: |
          pwd
          ls -la
          find . -maxdepth 2
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Mostrar PYTHONPATH
        run: |
          python -c "import os,sys; print(os.getcwd()); print(); print(sys.path)"
      - name: Ejecutar pruebas
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          if find tests -type f -name "test_*.py" 2>/dev/null | grep -q .
          then
            python -m pytest -v
          else
            echo "No se encontraron archivos de pruebas."
            echo "Se omite pytest."
          fi