
name: Build and publish EmotionLab model image

on:
  workflow_dispatch:
    inputs:
      publish_image:
        description: Publish image to AWS ECR
        required: true
        default: true
        type: boolean
      aws_region:
        description: AWS region
        required: true
        default: us-east-1
        type: string
      repository:
        description: ECR repository
        required: true
        default: emotionlab-model
        type: string

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify model
        run: |
          python -m pip install -r requirements-v2.txt
          python ia/modelo_v2/emotionlab_inferencia.py \
            ia/modelo_v2 \
            ia/modelo_v2/ejemplo_solicitud.json

      - name: Configure AWS credentials
        if: ${{ inputs.publish_image }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ inputs.aws_region }}

      - name: Verify AWS identity
        if: ${{ inputs.publish_image }}
        run: aws sts get-caller-identity

      - name: Login to Amazon ECR
        if: ${{ inputs.publish_image }}
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        if: ${{ inputs.publish_image }}
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        if: ${{ inputs.publish_image }}
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ inputs.repository }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --provenance=false \
            --sbom=false \
            --push \
            -f model-v2-image/Dockerfile \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            .

          echo "Published: $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
