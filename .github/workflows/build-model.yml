name: Validate EmotionLab V8 package

on:
  workflow_dispatch:

permissions:
  contents: read

  
jobs:
  validate-v8:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13.18"
      - name: Install backend and model dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify the V8 inference package
        run: python -m pytest tests/test_emotion_model_v8.py -q
